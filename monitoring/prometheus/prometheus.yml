global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['192.168.1.104:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'worker-service'
    static_configs:
      - targets: ['192.168.1.104:8082']
    metrics_path: '/metrics'
    scrape_interval: 10s
